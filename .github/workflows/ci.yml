name: CI

# Integração contínua: roda a cada push/PR para garantir que o
# pipeline treina e os testes passam.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Treinar pipeline (smoke)
        run: python -m src.train

      - name: Rodar testes
        run: pytest -q
