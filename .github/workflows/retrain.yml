name: Retreino Automático (MLOps)

# Ciclo automatizado de MLOps:
#   - Agendado (cron) e/ou disparado manualmente.
#   - Retreina os 3 modelos, escolhe o melhor pela métrica,
#     versiona os artefatos e faz commit/push de volta ao servidor (repo).
on:
  schedule:
    - cron: "0 3 * * 1"      # toda segunda-feira às 03:00 UTC
  workflow_dispatch: {}       # botão "Run workflow" na aba Actions

permissions:
  contents: write             # necessário para o git push do bot

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Identidade do bot
        run: |
          git config user.name "mlops-bot"
          git config user.email "mlops-bot@users.noreply.github.com"

      - name: Executar ciclo de retreino e versionar
        env:
          PUSH: "1"
        run: bash scripts/retrain.sh
